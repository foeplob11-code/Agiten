<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agiten — 내 자동화 비서</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e9ef; --muted:#8b93a3;
    --me:#2f6df6; --bot:#1e2430; --chip:#243042; --chiptx:#9fc3ff;
    --warn:#f0b429; --ok:#3fb950; --err:#f85149;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f7; --panel:#fff; --line:#e3e6eb; --txt:#1a1d24; --muted:#6b7280;
      --bot:#eef1f5; --chip:#e6efff; --chiptx:#1f5fd6; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  header .logo{font-size:22px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.bot{align-self:flex-start;align-items:flex-start}
  .bubble{padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .bot .bubble{background:var(--bot);border-bottom-left-radius:4px}
  .think{font-size:12px;color:var(--muted);font-style:italic;margin:2px 4px}
  .chip{background:var(--chip);color:var(--chiptx);border-radius:10px;padding:8px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;margin:3px 0;
    white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
  .chip .tool{font-weight:700}
  .result{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;margin:2px 4px}
  .result.err{color:var(--err)}
  footer{padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
  .controls{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
  .toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--warn)}
  .composer{display:flex;gap:10px}
  #msg{flex:1;background:var(--bot);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 14px;font-size:15px;resize:none;font-family:inherit;max-height:140px}
  #msg:focus{outline:2px solid var(--me);border-color:transparent}
  button.send{background:var(--me);color:#fff;border:none;border-radius:12px;padding:0 20px;
    font-size:15px;font-weight:600;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin:auto;max-width:420px;line-height:1.7}
  .hint code{background:var(--chip);color:var(--chiptx);padding:1px 6px;border-radius:5px}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header>
  <span class="logo">🤖</span>
  <h1>Agiten <span style="color:var(--muted);font-weight:400">— 내 자동화 비서</span></h1>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">확인 중…</span></div>
</header>

<div id="chat">
  <div class="hint" id="hint">
    안녕하세요! 저는 회원님이 처음부터 만든 자동화 비서예요.<br><br>
    이렇게 시켜보세요:<br>
    <code>test.py 만들고 실행해줘</code><br>
    <code>이 폴더에 뭐 있어?</code><br>
    <code>파일 지워줘</code> (모호하면 되물어요)<br><br>
    실제로 파일을 만들고 명령을 실행해요. 위험한 작업은 <b>실행 허용</b>을 켜야 돌아갑니다.
  </div>
</div>

<footer>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="allow"> ⚠ 위험 작업 실행 허용 (파일 쓰기·명령 실행)</label>
    <button class="reset" onclick="resetChat()">대화 초기화</button>
  </div>
  <div class="composer">
    <textarea id="msg" rows="1" placeholder="메시지를 입력하세요…  (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button class="send" id="send" onclick="send()">보내기</button>
  </div>
</footer>

<script>
const chat=document.getElementById('chat'), msg=document.getElementById('msg'),
      sendBtn=document.getElementById('send'), dot=document.getElementById('dot'),
      stat=document.getElementById('stat'), hint=document.getElementById('hint');

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function scroll(){chat.scrollTop=chat.scrollHeight}
function addRow(cls,html){const d=document.createElement('div');d.className='row '+cls;d.innerHTML=html;chat.appendChild(d);scroll();return d}
function addMe(t){addRow('me',`<div class="bubble">${esc(t)}</div>`)}

function renderEvents(events){
  let row=null;
  for(const e of events){
    if(e.kind==='think'&&e.data){addRow('bot',`<div class="think">💭 ${esc(e.data)}</div>`)}
    else if(e.kind==='call'){addRow('bot',`<div class="chip"><span class="tool">⚙ ${esc(e.data.name)}</span> ${esc(JSON.stringify(e.data.args))}</div>`)}
    else if(e.kind==='result'){let o={};try{o=JSON.parse(e.data)}catch(_){}
      const cls=o.ok===false?'result err':'result';
      addRow('bot',`<div class="${cls}">← ${esc(e.data.slice(0,240))}</div>`)}
    else if(e.kind==='final'&&e.data){addRow('bot',`<div class="bubble">${esc(e.data)}</div>`)}
  }
}

async function send(){
  const text=msg.value.trim(); if(!text)return;
  if(hint)hint.style.display='none';
  addMe(text); msg.value=''; msg.style.height='auto';
  sendBtn.disabled=true;
  const typing=addRow('bot',`<div class="bubble" style="color:var(--muted)">…생각 중</div>`);
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, allow:document.getElementById('allow').checked})});
    const j=await r.json();
    typing.remove();
    if(j.error){addRow('bot',`<div class="bubble result err">⚠ ${esc(j.error)}</div>`)}
    else renderEvents(j.events||[]);
  }catch(err){typing.remove();addRow('bot',`<div class="bubble result err">⚠ 서버 오류: ${esc(String(err))}</div>`)}
  sendBtn.disabled=false; msg.focus();
}

async function resetChat(){await fetch('/reset',{method:'POST'});chat.innerHTML='';if(hint){chat.appendChild(hint);hint.style.display=''}}

async function poll(){
  try{const r=await fetch('/status');const j=await r.json();
    if(j.ready){dot.className='dot on';stat.textContent=j.model||'모델 준비됨';sendBtn.disabled=false}
    else{dot.className='dot off';stat.textContent=j.detail||'모델 학습 중…';}
  }catch(_){dot.className='dot off';stat.textContent='서버 연결 끊김'}
}
poll(); setInterval(poll,4000);

msg.addEventListener('input',()=>{msg.style.height='auto';msg.style.height=Math.min(msg.scrollHeight,140)+'px'});
msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
msg.focus();
</script>
</body>
</html>
